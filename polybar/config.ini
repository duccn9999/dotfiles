[global/wm]
include-file = $HOME/.config/polybar/mocha.ini
[colors]
background = ${colors.base}
background-alt = ${colors.surface0}
foreground = ${colors.text}

primary = ${colors.mauve}
secondary = ${colors.blue}

alert = ${colors.red}
disabled = ${colors.overlay0}

border = ${colors.crust}

[bar/main]
width = 100%
height = 40
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 0
border-color = ${colors.border}

line-size = 0

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = JetBrainsMono Nerd Font:size=16;3

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = generic
override-redirect = false; wm-restack = generic

modules-left = xworkspaces wallpaper screenshot 
;modules-center = 
modules-right = network cpu memory pulseaudio date power
; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
    ; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

enable-click = true
enable-scroll = false

label-active = %name%
label-active-background = ${colors.mauve}
label-active-foreground = ${colors.base}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.text}
label-occupied-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.overlay0}
label-empty-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.base}
label-urgent-padding = 1

[module/wallpaper]
type = custom/text
content = "󰸉"
content-foreground = ${colors.text}
click-left = ~/.config/polybar/scripts/wallpaper.sh
content-padding = 0
[module/screenshot]
type = custom/text
content = " "
content-foreground = ${colors.text}
click-left = ~/.config/polybar/scripts/screenshot.sh
content-padding = 0
[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume>  <label-volume>
format-volume-foreground = ${colors.text}

label-volume = %percentage%%

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

ramp-volume-foreground = ${colors.mauve}

label-muted =  Muted
label-muted-foreground = ${colors.overlay0}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %d/%m/%Y %H:%M
date-alt = %A, %d %B %Y %H:%M:%S

format-prefix = " "
format-prefix-foreground = ${colors.mauve}

label = %date%
label-foreground = ${colors.text}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/network]
type = internal/network

interface-type = wireless
interval = 3

format-connected = <label-connected>
format-connected-prefix = "󰤨 "
format-connected-prefix-foreground = ${colors.mauve}

label-connected = %essid%
label-connected-foreground = ${colors.text}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰤭 "
format-disconnected-prefix-foreground = ${colors.overlay0}

label-disconnected = Offline
label-disconnected-foreground = ${colors.overlay0}


[module/power]
type = custom/text

content = ⏻
content-foreground = ${colors.red}
content-padding = 1

click-left = ~/.config/polybar/scripts/powermenu.sh
; vim:ft=dosini

